<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Make page-turning flipbooks, ebooks and guides with an embed and a PDF.">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Flipbook Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&family=Domine:wght@500;700&family=Nunito+Sans:wght@400;600;700;800&family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600;700;800&family=Bricolage+Grotesque:wght@600;700;800&family=Literata:wght@400;600;700&display=swap">
<style>
/* Layout: a light-table workspace. Library is a shelf of cover thumbnails; the editor is outline | writing column | live pages. */
:root{
  --bg:#E8EBEF; --panel:#FFFFFF; --sunk:#F3F5F8; --ink:#172133; --muted:#586374; --line:#D3D9E1;
  --brand:#17365F; --on-brand:#FFFFFF; --accent:#D7772B; --accent-ink:#8A4512; --ok:#2E7D55; --danger:#B23A2E; --focus:#2F6FD1;
  --display:"Fraunces", Georgia, serif; --body:"Figtree", "Segoe UI", Arial, sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151B; --panel:#1A2029; --sunk:#151A22; --ink:#E6EAF0; --muted:#9BA5B4; --line:#2C3543;
    --brand:#9DB9E6; --on-brand:#0E1724; --accent:#E8995A; --accent-ink:#F2B57F; --ok:#6CC895; --danger:#F08C80; --focus:#8DB3F2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151B; --panel:#1A2029; --sunk:#151A22; --ink:#E6EAF0; --muted:#9BA5B4; --line:#2C3543;
  --brand:#9DB9E6; --on-brand:#0E1724; --accent:#E8995A; --accent-ink:#F2B57F; --ok:#6CC895; --danger:#F08C80; --focus:#8DB3F2; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--ink);background:none;border:0;padding:4px 2px;cursor:pointer;white-space:nowrap}
.glyph{position:relative;width:22px;height:28px;border-radius:3px;background:var(--brand);flex:none;overflow:hidden}
.glyph::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;background:linear-gradient(135deg,var(--brand) 50%,var(--accent) 50%)}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.crumb .sep{color:var(--muted)}
.crumb input{min-width:0;flex:1;max-width:420px;border:1px solid transparent;background:transparent;border-radius:7px;padding:6px 8px;font-weight:700;font-size:15.5px}
.crumb input:hover{border-color:var(--line)}
.crumb input:focus{border-color:var(--focus);background:var(--sunk);outline:none}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.saved{font-size:12.5px;color:var(--muted);min-width:70px;text-align:right}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:8px;padding:9px 14px;font-weight:700;font-size:14px;line-height:1.2;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-accent{background:var(--accent);color:#1B1006}
.btn-accent:hover{filter:brightness(1.06)}
.btn-line{background:var(--panel);border-color:var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--muted)}
.btn-ghost{background:transparent;color:var(--ink)}
.btn-ghost:hover{background:var(--sunk)}
.btn-danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn-sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}

.wrap{max-width:1500px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* library */
.lib-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.lib-head h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1.1;letter-spacing:-.015em;text-wrap:balance}
.lib-head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.lib-actions{display:flex;gap:8px;flex-wrap:wrap}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 22px}
.bk{display:flex;flex-direction:column;gap:10px;min-width:0}
.bk-cover{position:relative;display:block;padding:0;border:0;background:none;cursor:pointer;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 10px 24px rgba(16,24,40,.16);transition:transform .2s ease, box-shadow .2s ease;overflow:hidden}
.bk-cover:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(16,24,40,.22)}
.bk-cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent)}
.bk-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.bk-title{font-weight:800;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.bk-sub{font-family:var(--mono);font-size:12px;color:var(--muted)}
.bk-tools{display:flex;gap:4px;flex-wrap:wrap}
.empty-shelf{border:2px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted);grid-column:1/-1}
.thumb{position:relative;overflow:hidden;background:var(--panel)}
.thumb > .fbe{position:absolute;left:0;top:0}
.storage-note{margin:0 0 18px;padding:12px 14px;border-radius:var(--r);background:color-mix(in srgb,var(--accent) 16%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);font-size:14px}

/* editor */
.ed{display:grid;grid-template-columns:270px minmax(0,1fr) 330px;gap:20px;align-items:start}
@media (max-width:1240px){.ed{grid-template-columns:250px minmax(0,1fr)}.pv{grid-column:1/-1}}
@media (max-width:820px){.ed{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 96px);overflow:auto;padding:14px}
@media (max-width:820px){.side{position:static;max-height:none}}
.side h2,.col h2,.pv h2{margin:0;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.outline{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.ol-item{display:flex;align-items:center;gap:6px;border-radius:8px}
.ol-item > button.go{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink);font-weight:600;font-size:14.5px}
.ol-item > button.go:hover{background:var(--sunk)}
.ol-item.on > button.go{background:color-mix(in srgb,var(--brand) 14%,var(--panel));color:var(--ink);font-weight:800}
.ol-item .num{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:none;width:20px}
.ol-item .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ol-item .pgs{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:none}
.mini{display:flex;gap:2px}
.mini button{width:26px;height:26px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;line-height:1}
.mini button:hover{border-color:var(--line);color:var(--ink)}
.mini button[disabled]{opacity:.3;cursor:default}
.mini .btn{width:auto;height:auto;padding:4px 8px;font-size:12.5px;color:var(--ink)}
.ol-sub{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 10px 2px}

.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.sec-head .k{font-family:var(--mono);font-size:12px;color:var(--accent-ink);letter-spacing:.06em}
.sec-head h1{margin:2px 0 0;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.15;text-wrap:balance}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.f{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:13px;font-weight:700;color:var(--muted)}
.f .hint{font-weight:500;font-size:12.5px}
.f input[type=text],.f input[type=url],.f textarea,.f select{width:100%;min-width:0;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:15px;font-weight:500;color:var(--ink);line-height:1.5}
.f textarea{resize:vertical;min-height:70px}
.f textarea.big{min-height:130px;font-size:15.5px;line-height:1.6}
.f input:focus,.f textarea:focus,.f select:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.check{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.help{margin:0;font-size:13px;color:var(--muted)}
.help code{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:1px 5px;border-radius:4px}

/* blocks */
.blocks{display:flex;flex-direction:column;gap:12px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.blk-top{display:flex;align-items:center;gap:8px}
.blk-type{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin-right:auto}
.blk.drop{outline:2px dashed var(--focus)}
.adder{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:12px;border:1px dashed var(--line);border-radius:var(--r);background:var(--sunk)}
.adder .lab{font-size:13px;font-weight:700;color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--brand)}
.cards-list{display:flex;flex-direction:column;gap:10px}
.fc-ed{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.fc-ed .f input,.fc-ed .f textarea{background:var(--panel)}
.fc-ed-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800}
.imgbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.imgbox img{width:120px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--sunk)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink)}
.sw[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 35%,transparent)}
.sw i{width:22px;height:22px;border-radius:50%;flex:none;display:inline-block;border:1px solid rgba(0,0,0,.12)}
.colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.colors label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.colors input[type=color]{width:40px;height:32px;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--panel);cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--panel);padding:8px 12px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}

/* live pages */
.pv{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);padding:14px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 96px);overflow:auto}
@media (max-width:1240px){.pv{position:static;max-height:none}}
.pv-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pv-total{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.pv-pg{display:flex;flex-direction:column;gap:5px;align-items:center;background:none;border:0;padding:0;cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:11.5px}
.pv-pg .thumb{box-shadow:0 4px 14px rgba(16,24,40,.16);border-radius:2px}
.pv-pg:hover .thumb{box-shadow:0 0 0 2px var(--brand),0 6px 18px rgba(16,24,40,.2)}
.pv-note{margin:0;font-size:13px;color:var(--muted)}

/* overlays */
.ov{position:fixed;inset:0;z-index:60;background:rgba(10,14,20,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{width:min(760px,100%);max-height:100%;overflow:auto;background:var(--panel);color:var(--ink);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.35);display:flex;flex-direction:column}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 6px}
.dlg-head h2{margin:0;font-family:var(--display);font-size:24px;font-weight:700;line-height:1.2}
.dlg-body{padding:10px 20px 20px;display:flex;flex-direction:column;gap:14px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tpl{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;color:var(--ink)}
.tpl:hover{border-color:var(--brand)}
.tpl .nm{font-weight:800;font-size:15px}
.tpl .bl{font-size:13px;color:var(--muted)}
.tpl .ex{font-family:var(--mono);font-size:11px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.08em}
.pub-grid{display:grid;gap:14px}
.pub{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--sunk)}
.pub h3{margin:0;font-size:16px;font-weight:800}
.pub p,.pub ol{margin:0;font-size:14px;color:var(--muted)}
.pub ol{padding-left:20px;display:flex;flex-direction:column;gap:3px}
.pub pre{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-all;max-height:160px;overflow:auto}
.pub .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prog{font-size:13px;font-weight:700;color:var(--muted)}
.reader-ov{position:fixed;inset:0;z-index:70;background:#1E242E}
.drop-zone{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.drop-zone.over{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--panel))}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.bk-cover{transition:none}}
</style>
<style id="fbe-css">
/* ===== Flipbook engine: page design (shared by studio, reader and exported books) ===== */
.fbe{--pw:612px;--ph:792px;--fs:12px;--mx:56px;--mt:58px;--mb:46px;
  --c1:#142E54;--c2:#E0A23B;--paper:#FBFAF7;--ink:#1B2433;--muted:#5E6878;--on1:#FFFFFF;--on2:#142E54;--soft:#EFEBE2;
  --fd:"Domine",Georgia,serif;--fb:"Nunito Sans",Arial,sans-serif;--fm:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.fbe.sz-trade{--pw:540px;--ph:810px;--fs:13px;--mx:50px;--mt:54px;--mb:44px}
.fbe.sz-square{--pw:700px;--ph:700px;--fs:13.5px;--mx:58px;--mt:54px;--mb:44px}
.fbp{position:relative;width:var(--pw);height:var(--ph);overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:var(--fs);line-height:1.55;box-sizing:border-box;text-align:left;-webkit-font-smoothing:antialiased}
.fbp *,.fbp *::before,.fbp *::after{box-sizing:border-box}
.fbp-body{position:absolute;left:var(--mx);right:var(--mx);top:var(--mt);bottom:calc(var(--mb) + 18px);display:flex;flex-direction:column;gap:calc(var(--fs) * .95);overflow:hidden}
.fbp-foot{position:absolute;left:var(--mx);right:var(--mx);bottom:calc(var(--mb) - 14px);display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:calc(var(--fs) * .72);color:var(--muted);letter-spacing:.04em}
.fbp-foot .t{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;text-transform:uppercase;font-weight:700;letter-spacing:.12em}
.fbp-foot .n{font-family:var(--fm);font-variant-numeric:tabular-nums}
.fbp p{margin:0}
.fbp a{color:var(--c1);text-decoration:underline;text-underline-offset:2px}
.fbp strong{font-weight:800}
/* blocks */
.b-open{display:flex;flex-direction:column;gap:calc(var(--fs) * .5);padding-bottom:calc(var(--fs) * 1.1);margin-bottom:calc(var(--fs) * .2);border-bottom:2px solid var(--c2)}
.b-open .k{font-family:var(--fm);font-size:calc(var(--fs) * .78);letter-spacing:.14em;text-transform:uppercase;color:var(--c1);opacity:.8}
.b-open h2{margin:0;font-family:var(--fd);font-weight:700;font-size:calc(var(--fs) * 2.45);line-height:1.12;color:var(--c1);text-wrap:balance}
.b-h{margin:calc(var(--fs) * .4) 0 0;font-family:var(--fd);font-weight:700;font-size:calc(var(--fs) * 1.42);line-height:1.25;color:var(--c1);text-wrap:balance}
.b-p{hyphens:auto;-webkit-hyphens:auto}
.b-list{margin:0;padding-left:1.35em;display:flex;flex-direction:column;gap:calc(var(--fs) * .35)}
.b-list li::marker{color:var(--c1);font-weight:800}
.b-quote{margin:0;padding:calc(var(--fs) * .2) 0 calc(var(--fs) * .2) calc(var(--fs) * 1.1);border-left:3px solid var(--c2);font-family:var(--fd);font-size:calc(var(--fs) * 1.2);line-height:1.45;color:var(--c1)}
.b-quote cite{display:block;margin-top:calc(var(--fs) * .5);font-family:var(--fb);font-style:normal;font-size:calc(var(--fs) * .82);font-weight:700;color:var(--muted)}

    var g = e.target.closest('[data-goto]');

    if(e.target.closest('a,button,label,input,.fbv-nav')) return;
    var r = book.getBoundingClientRect();
    if(e.clientX > r.right - r.width * .18 && e.clientX <= r.right) go(1);
    else if(e.clientX < r.left + r.width * .18 && e.clientX >= r.left) go(-1);

  stage.addEventListener('pointerdown', function(e){ if(e.target.closest('label,a,button')) return; sx = e.clientX; sy = e.clientY; });

    if(sx == null) return;

  if(ro) ro.observe(stage); else global.addEventListener('resize', layout);
  if(opts.start) idx = Math.max(0, Math.min(n - 1, opts.start));

  self.focus = function(){ try{ v.focus({preventScroll:true}); }catch(e){ v.focus(); } };
  self.destroy = function(){ if(ro) ro.disconnect(); root.innerHTML = ''; };
};

var LIBS = {
  h2c:'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  pdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
};
function loadScript(src){
  return new Promise(function(res, rej){
    var s = document.createElement('script'); s.src = src; s.async = true;
    s.onload = res; s.onerror = function(){ rej(new Error('Could not load the PDF tools. Check your internet connection and try again.')); };
    document.head.appendChild(s);
  });
}
FBE.makePdf = function(pub, onProgress){
  var size = FBE.sizeOf(pub);
  return Promise.all([
    global.html2canvas ? null : loadScript(LIBS.h2c),
    (global.jspdf && global.jspdf.jsPDF) ? null : loadScript(LIBS.pdf)
  ]).then(function(){ return FBE.prepare(pub); }).then(function(){
    var pages = FBE.paginate(pub, {print:true});
    var orient = size.inW > size.inH ? 'l' : 'p';
    var doc = new global.jspdf.jsPDF({orientation:orient, unit:'pt', format:[size.inW * 72, size.inH * 72], compress:true});
    var box = document.createElement('div');
    box.dataset.baseStyle = 'position:fixed;left:-20000px;top:0;pointer-events:none;';
    FBE.dress(box, pub, 'print');
    document.body.appendChild(box);
    var i = 0;
    function step(){
      if(i >= pages.length){ box.remove(); return doc.output('blob'); }
      box.innerHTML = pages[i].html;
      if(onProgress) onProgress(i + 1, pages.length);
      return global.html2canvas(box.firstChild, {scale:2.2, backgroundColor:null, useCORS:true, logging:false}).then(function(cv){
        if(i > 0) doc.addPage([size.inW * 72, size.inH * 72], orient);
        doc.addImage(cv.toDataURL('image/jpeg', .9), 'JPEG', 0, 0, size.inW * 72, size.inH * 72, undefined, 'FAST');
        /* keep links clickable in the PDF */
        var pr = box.firstChild.getBoundingClientRect(), k = (size.inW * 72) / pr.width;
        box.querySelectorAll('a[href^="http"]').forEach(function(a){
          var r = a.getBoundingClientRect();
          try{ doc.link((r.left - pr.left) * k, (r.top - pr.top) * k, r.width * k, r.height * k, {url:a.href}); }catch(e){}
        });
        i++;
        return step();
      });
    }
    return step();
  });
};

FBE.slug = function(x){ return String(x || '').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50) || 'book'; };

/* Turns pasted text or Markdown into chapters and blocks. */
function fromText(text, fallbackTitle){
  var lines = String(text || '').replace(/\r/g, '').split('\n');
  var book = {title:'', chapters:[]};
  var ch = null, para = [], list = null;
  function chapter(title){ ch = {title:title, blocks:[]}; book.chapters.push(ch); }
  function ensure(){ if(!ch) chapter('Chapter one'); }
  function flush(){
    if(para.length){ ensure(); ch.blocks.push({type:'paragraph', text:para.join(' ')}); para = []; }
    if(list){ ensure(); ch.blocks.push({type:'list', style:list.style, text:list.items.join('\n')}); list = null; }
  }
  lines.forEach(function(raw){
    var l = raw.trim(), m;
    if(!l){ flush(); return; }
    if((m = l.match(/^#\s+(.+)/))){ flush(); if(!book.title && !book.chapters.length && !ch){ /* first H1 with nothing before it is the book title only if a second H1 exists later */ } chapter(m[1]); return; }
    if((m = l.match(/^#{2,6}\s+(.+)/))){ flush(); ensure(); ch.blocks.push({type:'heading', text:m[1]}); return; }
    if((m = l.match(/^>\s?(.*)/))){ flush(); ensure(); ch.blocks.push({type:'quote', text:m[1]}); return; }
    if(/^(-{3,}|\*{3,})$/.test(l)){ flush(); ensure(); ch.blocks.push({type:'divider'}); return; }
    if((m = l.match(/^!\[([^\]]*)\]\((https:\/\/[^)\s]+)\)/))){ flush(); ensure(); ch.blocks.push({type:'image', src:m[2], caption:m[1], width:'full'}); return; }
    if((m = l.match(/^[-*•]\s+(.+)/))){ if(para.length) { var keep = list; list = null; flush(); list = keep; } if(!list || list.style !== 'bullet'){ if(list) flush(); list = {style:'bullet', items:[]}; } list.items.push(m[1]); return; }
    if((m = l.match(/^\d+[.)]\s+(.+)/))){ if(para.length) { var keep2 = list; list = null; flush(); list = keep2; } if(!list || list.style !== 'number'){ if(list) flush(); list = {style:'number', items:[]}; } list.items.push(m[1]); return; }
    if(list) flush();
    para.push(l);
  });
  flush();
  /* a lone first "# Title" followed by more chapters becomes the book title */
  if(book.chapters.length > 1 && !book.chapters[0].blocks.length){ book.title = book.chapters.shift().title; }
  if(book.chapters.length === 1 && !book.title){ book.title = book.chapters[0].title === 'Chapter one' ? (fallbackTitle || 'Untitled book') : book.chapters[0].title; }
  if(!book.title) book.title = fallbackTitle || 'Untitled book';
  if(!book.chapters.length) book.chapters.push({title:'Chapter one', blocks:[{type:'paragraph', text:''}]});
  return book;
}

/* Turns HTML (from a Word file) into chapters and blocks. */
function fromHtml(html, fallbackTitle){
  var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  var root = doc.body.firstChild;
  var book = {title:'', chapters:[]}, ch = null, pending = [];
  var hasH1 = !!root.querySelector('h1');
  var chapTag = hasH1 ? 'H1' : (root.querySelector('h2') ? 'H2' : null);
  function md(node){
    var out = '';
    node.childNodes.forEach(function(c){
      if(c.nodeType === 3){ out += c.nodeValue; return; }
      if(c.nodeType !== 1) return;
      var inner = md(c);
      if(c.tagName === 'STRONG' || c.tagName === 'B') out += inner.trim() ? '**' + inner.trim() + '** ' : '';
      else if(c.tagName === 'EM' || c.tagName === 'I') out += inner.trim() ? '*' + inner.trim() + '* ' : '';
      else if(c.tagName === 'A' && /^https?:/i.test(c.getAttribute('href') || '')) out += '[' + inner.trim() + '](' + c.getAttribute('href') + ') ';
      else if(c.tagName === 'BR') out += '\n';
      else out += inner;
    });
    return out.replace(/[ \t]+/g, ' ');
  }
  function ensure(){ if(!ch){ ch = {title:'Chapter one', blocks:[]}; book.chapters.push(ch); } }
  function push(b){ ensure(); ch.blocks.push(b); }
  Array.prototype.forEach.call(root.children, function(n){
    var tag = n.tagName, txt = md(n).trim();
    if(tag === chapTag){ if(txt){ ch = {title:txt, blocks:[]}; book.chapters.push(ch); } return; }
    if(/^H[1-6]$/.test(tag)){ if(txt) push({type:'heading', text:txt}); return; }
    if(tag === 'UL' || tag === 'OL'){
      var items = Array.prototype.map.call(n.querySelectorAll(':scope > li'), function(li){ return md(li).trim(); }).filter(Boolean);
      if(items.length) push({type:'list', style:tag === 'OL' ? 'number' : 'bullet', text:items.join('\n')});
      return;
    }
    if(tag === 'BLOCKQUOTE'){ if(txt) push({type:'quote', text:txt}); return; }
    if(tag === 'TABLE'){
      Array.prototype.forEach.call(n.querySelectorAll('tr'), function(tr){
        var cells = Array.prototype.map.call(tr.children, function(td){ return md(td).trim(); }).filter(Boolean);
        if(cells.length) push({type:'paragraph', text:cells.join(' · ')});
      });
      return;
    }
    var imgs = n.querySelectorAll('img');
    imgs.forEach(function(im){ var src = im.getAttribute('src') || ''; if(/^data:image\//.test(src)) pending.push({ref:push({type:'image', src:src, width:'full', caption:im.getAttribute('alt') || ''}) }); });
    if(txt) push({type:'paragraph', text:txt});
  });
  if(book.chapters.length > 1 && !book.chapters[0].blocks.length) book.title = book.chapters.shift().title;
  book.title = book.title || (book.chapters.length === 1 && book.chapters[0].title !== 'Chapter one' ? book.chapters[0].title : (fallbackTitle || 'Untitled book'));
  if(!book.chapters.length) book.chapters.push({title:'Chapter one', blocks:[{type:'paragraph', text:''}]});
  return book;
}

global.FBT = {TEMPLATES:TEMPLATES, fromText:fromText, fromHtml:fromHtml};

/* ---------- images ---------- */
function shrink(src, max){
  return new Promise(function(res){
    var im = new Image();
    im.onload = function(){
      var w = im.naturalWidth, hh = im.naturalHeight, k = Math.min(1, max / Math.max(w, hh));
      var cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(hh * k);
      var x = cv.getContext('2d');
      x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, cv.width, cv.height);
      x.drawImage(im, 0, 0, cv.width, cv.height);
      var out = cv.toDataURL('image/jpeg', .84);
      res({src:out.length < src.length || k < 1 ? out : src, w:cv.width, h:cv.height});
    };
    im.onerror = function(){ res(null); };
    im.src = src;
  });
}
function readImage(file){
  return new Promise(function(res){
    if(!/^image\//.test(file.type)){ toast('Choose an image file (JPG, PNG, WebP or GIF).'); res(null); return; }
    var fr = new FileReader();
    fr.onload = function(){ shrink(fr.result, 1600).then(res); };
    fr.onerror = function(){ res(null); };
    fr.readAsDataURL(file);
  });
}
function shrinkImages(book){
  var jobs = [];
  book.chapters.forEach(function(c){ (c.blocks || []).forEach(function(b){
    if(b.type === 'image' && /^data:/.test(b.src || '')) jobs.push(shrink(b.src, 1600).then(function(r){ if(r){ b.src = r.src; b.w = r.w; b.h = r.h; } }));
  }); });
  return Promise.all(jobs);
}

  insert.appendChild(h('option', {value:'', text:'+ Below'}));
  Object.keys(FBE.BLOCKS).forEach(function(k){ insert.appendChild(h('option', {value:k, text:FBE.BLOCKS[k]})); });
  insert.addEventListener('change', function(){
    if(!insert.value) return;
    var nb = NEW_BLOCK[insert.value](); nb.id = uid(); ch.blocks.splice(bi + 1, 0, nb);
    renderSection(); changed(); focusBlock(nb.id);
  });
  var del = h('button', {type:'button', 'aria-label':'Delete this block', html:'&#10005;'});
  del.addEventListener('click', function(){
    var hasText = t(b.text) || t(b.src) || t(b.value) || t(b.caption) || (b.cards || []).some(function(c){ return t(c.f) || t(c.b); });
    var go = function(){ ch.blocks.splice(bi, 1); renderSection(); changed(); toast('Block deleted'); };
    if(!hasText) return go();
    if(del.dataset.armed){ go(); return; }
    del.dataset.armed = '1'; del.textContent = 'Delete?'; del.style.width = 'auto'; del.style.padding = '0 8px';
    setTimeout(function(){ if(del.isConnected && del.dataset.armed){ delete del.dataset.armed; del.innerHTML = '&#10005;'; del.style.width = ''; del.style.padding = ''; } }, 3200);
  });
  box.appendChild(h('div', {class:'blk-top'}, [
    h('span', {class:'blk-type', text:FBE.BLOCKS[b.type] || b.type}),
    insert,
    h('div', {class:'mini'}, [
      h('button', {type:'button', 'aria-label':'Move block up', disabled:bi === 0, html:'&#8593;', onclick:function(){ move(ch.blocks, bi, -1); renderSection(); changed(); focusBlock(b.id); }}),
      h('button', {type:'button', 'aria-label':'Move block down', disabled:bi === n - 1, html:'&#8595;', onclick:function(){ move(ch.blocks, bi, 1); renderSection(); changed(); focusBlock(b.id); }}),
      h('button', {type:'button', 'aria-label':'Duplicate block', html:'&#10697;', onclick:function(){ var c = clone(b); c.id = uid(); ch.blocks.splice(bi + 1, 0, c); renderSection(); changed(); }}),
      del
    ])
  ]));
  var set = function(k){ return function(v){ b[k] = v; }; };
  var id = b.id;
  switch(b.type){
    case 'heading': box.appendChild(field('Subheading', b.text, set('text'), {id:id + 't'})); break;
    case 'paragraph': box.appendChild(field('Text', b.text, set('text'), {type:'textarea', big:true, rows:5, id:id + 't', hint:MARKS_HINT + '. Long text flows onto the next page by itself.'})); break;
    case 'list':
      box.appendChild(field('Items, one per line', b.text, set('text'), {type:'textarea', rows:4, id:id + 't'}));
      box.appendChild(field('Style', b.style, function(v){ b.style = v; }, {type:'select', id:id + 's', options:[['bullet','Bullets'],['number','Numbered steps']]}));
      break;
    case 'quote':
      box.appendChild(field('Quote', b.text, set('text'), {type:'textarea', rows:2, id:id + 't'}));
      box.appendChild(field('Who said it', b.by, set('by'), {id:id + 'b'}));
      break;
    case 'callout':
      box.appendChild(field('Style', b.tone, function(v){ b.tone = v; }, {type:'select', id:id + 'k', options:[['rights','Know your rights'],['info','Good to know'],['warn','Watch out']]}));
      box.appendChild(field('Title', b.title, set('title'), {id:id + 'h'}));
      box.appendChild(field('Text', b.text, set('text'), {type:'textarea', rows:3, id:id + 't', hint:MARKS_HINT}));
      box.appendChild(field('Citation', b.cite, set('cite'), {id:id + 'c', placeholder:'For example: 34 CFR 300.613'}));
      break;
    case 'keynum':
      box.appendChild(h('div', {class:'row'}, [field('Number', b.value, set('value'), {id:id + 'v', placeholder:'10'}), field('Unit', b.unit, set('unit'), {id:id + 'u', placeholder:'school days'})]));
      box.appendChild(field('What it means', b.text, set('text'), {type:'textarea', rows:2, id:id + 't'}));
      box.appendChild(field('Citation', b.cite, set('cite'), {id:id + 'c'}));
      break;
    case 'flip': box.appendChild(flipEditor(b)); break;
    case 'image':
      box.appendChild(imageField(b.src, function(r){ b.src = r.src; b.w = r.w; b.h = r.h; renderSection(); changed(); }, function(){ b.src = ''; delete b.w; delete b.h; renderSection(); changed(); }));
      box.appendChild(h('div', {class:'row'}, [
        field('Caption', b.caption, set('caption'), {id:id + 'c'}),
        field('Width', b.width, function(v){ b.width = v; }, {type:'select', id:id + 'w', options:[['full','Full width'],['half','Narrow, centered']]})
      ]));
      box.appendChild(field('Description for screen readers', b.alt, set('alt'), {id:id + 'a', hint:'What the image shows, in a sentence'}));
      break;
    case 'button':
      box.appendChild(h('div', {class:'row'}, [field('Button text', b.text, set('text'), {id:id + 't'}), field('Link', b.url, set('url'), {type:'url', id:id + 'u', placeholder:'https://'})]));
      break;
    case 'divider': box.appendChild(h('p', {class:'help', text:'A thin line between sections.'})); break;
    case 'pagebreak': box.appendChild(h('p', {class:'help', text:'What follows starts on a new page.'})); break;
  }
  return box;
}
function flipEditor(b){
  var wrap = h('div', {style:'display:flex;flex-direction:column;gap:10px'});
  wrap.appendChild(h('div', {class:'row'}, [
    field('Heading above the cards', b.title, function(v){ b.title = v; }, {id:b.id + 'h'}),
    field('Front label', b.frontLabel, function(v){ b.frontLabel = v; }, {id:b.id + 'fl'}),
    field('Back label', b.backLabel, function(v){ b.backLabel = v; }, {id:b.id + 'bl'})
  ]));
  var list = h('div', {class:'cards-list'});
  b.cards.forEach(function(c, ci){
    var rm = h('button', {class:'btn btn-ghost btn-sm', type:'button', text:'Remove'});
    rm.addEventListener('click', function(){
      var go = function(){ b.cards.splice(ci, 1); if(!b.cards.length) b.cards.push({f:'', b:'', cite:''}); renderSection(); changed(); };
      if(t(c.f) || t(c.b)) confirmBtn(rm, 'Remove', go); else go();
    });
    list.appendChild(h('div', {class:'fc-ed'}, [
      h('div', {class:'fc-ed-top'}, [h('span', {text:'Card ' + (ci + 1)}), h('div', {class:'mini'}, [
        h('button', {type:'button', 'aria-label':'Move card up', disabled:ci === 0, html:'&#8593;', onclick:function(){ move(b.cards, ci, -1); renderSection(); changed(); }}),
        h('button', {type:'button', 'aria-label':'Move card down', disabled:ci === b.cards.length - 1, html:'&#8595;', onclick:function(){ move(b.cards, ci, 1); renderSection(); changed(); }}),
        rm
      ])]),
      field('Front', c.f, function(v){ c.f = v; }, {type:'textarea', rows:2, id:b.id + 'f' + ci}),
      field('Back', c.b, function(v){ c.b = v; }, {type:'textarea', rows:2, id:b.id + 'b' + ci}),
      field('Citation', c.cite, function(v){ c.cite = v; }, {id:b.id + 'c' + ci})
    ]));
  });
  wrap.appendChild(list);
  wrap.appendChild(h('button', {class:'btn btn-line btn-sm', type:'button', style:'align-self:flex-start', text:'+ Add another card', onclick:function(){ b.cards.push({f:'', b:'', cite:''}); renderSection(); changed(); var e = $('f-' + b.id + 'f' + (b.cards.length - 1)); if(e) e.focus(); }}));
  wrap.appendChild(h('p', {class:'help', text:'Readers tap each card to flip it back and forth. In the PDF, each card shows its front and back together.'}));
  return wrap;
}

/* ---------- live pages ---------- */
var previewBusy = false;
function previewSoon(){ clearTimeout(previewSoon._t); previewSoon._t = setTimeout(function(){ preview(false); }, 450); }
function preview(first){
  if(!cur) return;
  var book = cur;
  FBE.prepare(book).then(function(){
    if(book !== cur) return;
    pages = FBE.paginate(book);
    renderPreviewPages();
  });
  if(first){ $('pv').innerHTML = '<p class="pv-note">Laying out pages…</p>'; }
}
function pagesFor(key){
  if(!pages.length) return [];
  if(key === 'cover') return [0];
  if(key === 'back'){ var l = pages.length - 1; return pages[l].kind === 'back' ? [l] : []; }
  if(key === 'design') return pages.map(function(_, i){ return i; }).slice(0, 6);
  var ci = cur.chapters.indexOf(chapterById(key));
  var out = [];
  pages.forEach(function(p, i){ if(p.kind === 'content' && p.chapter === ci) out.push(i); });
  return out;
}
function markPageCounts(){
  document.querySelectorAll('[data-pages]').forEach(function(e){
    var ps = pagesFor(e.dataset.pages);
    e.textContent = ps.length ? (ps.length === 1 ? 'p' + (ps[0] + 1) : 'pp' + (ps[0] + 1) + '–' + (ps[ps.length - 1] + 1)) : '';
  });
}
function renderPreviewPages(){
  if(!cur) return;
  var pv = $('pv'); pv.innerHTML = '';
  var ids = pagesFor(section);
  var label = section === 'design' ? 'First pages' : 'Pages in this section';
  pv.appendChild(h('div', {class:'pv-head'}, [h('h2', {text:label}), h('span', {class:'pv-total', text:pages.length + (pages.length === 1 ? ' page' : ' pages')})]));
  if(!ids.length){
    pv.appendChild(h('p', {class:'pv-note', text:section === 'back' ? 'No back cover yet. Add a heading or message to include one.' : 'Nothing to show yet.'}));
  } else {
    var grid = h('div', {class:'pv-grid'});
    ids.forEach(function(i){
      var b = h('button', {class:'pv-pg', type:'button', 'aria-label':'Open page ' + (i + 1) + ' in the flipbook'}, [thumb(cur, pages[i].html, 130), h('span', {text:'Page ' + (i + 1)})]);
      b.addEventListener('click', function(){ openReader(i); });
      grid.appendChild(b);
    });
    pv.appendChild(grid);
  }
  pv.appendChild(h('button', {class:'btn btn-line', type:'button', text:'Open the flipbook', onclick:function(){ openReader(ids[0] || 0); }}));
  markPageCounts();
}

/* ---------- reader ---------- */
function openReader(start){
  if(!cur) return;
  var book = cur;
  FBE.prepare(book).then(function(){
    pages = FBE.paginate(book);
    var ov = h('div', {class:'reader-ov', role:'dialog', 'aria-modal':'true', 'aria-label':'Flipbook preview'});
    $('layer').appendChild(ov);
    var prevFocus = document.activeElement;
    var viewer = new FBE.Viewer(ov, book, pages, {
      start:start || 0,
      onClose:function(){ close(); },
      actions:[{label:'Download PDF', run:function(btn, v){ pdf(book, btn, v); }}]
    });
    function close(){ viewer.destroy(); ov.remove(); document.removeEventListener('keydown', key); if(prevFocus && prevFocus.focus) prevFocus.focus(); }
    function key(e){ if(e.key === 'Escape' && !ov.querySelector('.fbv-menu')) close(); }
    document.addEventListener('keydown', key);
    viewer.focus();
  });
}
function pdf(book, btn, viewer){
  if(btn) btn.disabled = true;
  var say = function(m){ if(viewer) viewer.status(m); else if(btn) btn.textContent = m; };
  say('Making PDF…');
  return FBE.makePdf(book, function(i, n){ say('Making PDF: page ' + i + ' of ' + n); }).then(function(blob){
    if(viewer) viewer.status('');
    return saveFile(FBE.slug(book.title) + '.pdf', blob, 'application/pdf');
  }).catch(function(e){ toast(e && e.message ? e.message : 'Could not make the PDF.'); if(viewer) viewer.status(''); })
  .then(function(){ if(btn){ btn.disabled = false; if(!viewer) btn.textContent = 'Download PDF'; } });
}

/* ---------- publish ---------- */
function bookFile(book){
  var css = $('fbe-css').textContent, js = $('fbe-js').textContent;
  var data = JSON.stringify(normalize(clone(book))).replace(/</g, '\\u003c');
  var title = esc(t(book.title) || 'Flipbook');
  var desc = esc(t(book.cover.subtitle) || 'A flipbook');
  var th = FBE.themeOf(book);
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n' +
    '<title>' + title + '</title>\n<meta name="description" content="' + desc + '">\n<meta property="og:title" content="' + title + '">\n<meta property="og:description" content="' + desc + '">\n<meta property="og:type" content="book">\n<meta name="theme-color" content="' + th.c1 + '">\n' +
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="' + FBE.fontHref([book.settings.fonts]) + '">\n' +
    '<style>\nhtml,body{margin:0;height:100%;background:#1E242E}\n#app{height:100%}\n.fbv-load{color:#EEF1F5;font:600 15px system-ui,sans-serif;display:flex;height:100%;align-items:center;justify-content:center}\n' + css + '\n</style>\n</head>\n<body>\n<div id="app"><div class="fbv-load">Opening the flipbook…</div></div>\n' +
    '<script type="application/json" id="book">' + data + '<\/script>\n' +
    '<script>\n' + js + '\n<\/script>\n' +
    '<script>\n(function(){\nvar book = JSON.parse(document.getElementById("book").textContent);\nvar app = document.getElementById("app");\nfunction start(){\n  var pages = FBE.paginate(book);\n  var m = /^#p(\\d+)$/.exec(location.hash);\n  var v = new FBE.Viewer(app, book, pages, {start:m ? Number(m[1]) - 1 : 0, onPage:function(i){ try{ history.replaceState(null, "", "#p" + (i + 1)); }catch(e){} }, actions:[{label:"Download PDF", run:function(btn, viewer){\n    btn.disabled = true; viewer.status("Making PDF…");\n    FBE.makePdf(book, function(i, n){ viewer.status("Making PDF: page " + i + " of " + n); }).then(function(blob){\n      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = FBE.slug(book.title) + ".pdf"; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 4000);\n      viewer.status("PDF downloaded", 2500);\n    }).catch(function(e){ viewer.status(e.message || "Could not make the PDF", 4000); }).then(function(){ btn.disabled = false; });\n  }}]});\n  v.focus();\n}\nFBE.prepare(book).then(start, start);\n})();\n<\/script>\n</body>\n</html>\n';
}
function openPublish(){
  if(!cur) return;
  var book = cur, slug = FBE.slug(book.title);
  var sz = FBE.sizeOf(book);
  var urlIn = h('input', {type:'url', id:'pubUrl', placeholder:'https://yourwebsite.com/books/' + slug + '.html'});
  urlIn.value = book.publish.url || '';
  var code = h('pre', {id:'embedCode'});
  function embed(){
    var u = FBE.safeUrl(urlIn.value) || 'https://yourwebsite.com/books/' + slug + '.html';
    var ratio = (2 * sz.w) + ' / ' + (sz.h + 120);
    code.textContent = '<iframe src="' + u + '" title="' + (t(book.title) || 'Flipbook').replace(/"/g, '&quot;') + '" style="width:100%;max-width:1100px;aspect-ratio:' + ratio + ';border:0;border-radius:8px;display:block;margin:0 auto" allowfullscreen loading="lazy"></iframe>';
  }
  urlIn.addEventListener('input', function(){ book.publish.url = urlIn.value; embed(); saveSoon(); });
  embed();
  var pdfBtn = h('button', {class:'btn btn-line', type:'button', text:'Download PDF'});
  pdfBtn.addEventListener('click', function(){ pdf(book, pdfBtn, null); });
  var body = h('div', {class:'pub-grid'}, [
    h('section', {class:'pub'}, [
      h('h3', {text:'1. Flipbook file for a share link'}),
      h('p', {text:'One file holds the whole page-turning book. Put it online and the address is your share link.'}),
      h('div', {class:'acts'}, [h('button', {class:'btn btn-primary', type:'button', text:'Download flipbook (' + slug + '.html)', onclick:function(){ saveFile(slug + '.html', bookFile(book), 'text/html'); }})]),
      h('ol', {}, [
        h('li', {html:'<b>Quickest:</b> go to app.netlify.com/drop and drop the file. Netlify gives you a link right away.'}),
        h('li', {html:'<b>On your Bolt site:</b> in the Code tab, drag the file into the <b>public</b> folder (make a <b>books</b> folder inside it if you like), then Publish. The link is your site address plus <b>/books/' + esc(slug) + '.html</b>.'})
      ])
    ]),
    h('section', {class:'pub'}, [
      h('h3', {text:'2. Embed it on your website'}),
      h('label', {class:'f', for:'pubUrl'}, ['Where the flipbook file lives', h('span', {class:'hint', text:'Paste the share link from step 1.'})]),
      urlIn,
      code,
      h('div', {class:'acts'}, [h('button', {class:'btn btn-line', type:'button', text:'Copy embed code', onclick:function(){ copy(code.textContent, code); }})]),
      h('p', {text:'Paste this into an HTML or embed block. In Bolt, put it in the page’s code where the book should appear.'})
    ]),
    h('section', {class:'pub'}, [
      h('h3', {text:'3. PDF to download or print'}),
      h('p', {text:'Same pages at ' + sz.inW + ' × ' + sz.inH + ' inches, with links that still work. Flip cards show both sides.'}),
      h('div', {class:'acts'}, [pdfBtn])
    ]),
    h('section', {class:'pub'}, [
      h('h3', {text:'Backup'}),
      h('p', {text:'Your books are kept in this browser. Download a backup file to keep a copy, move to another computer, or share an editable version with a teammate (they use Import).'}),
      h('div', {class:'acts'}, [h('button', {class:'btn btn-ghost', type:'button', text:'Download backup file', onclick:backup}), h('button', {class:'btn btn-ghost', type:'button', text:'Back up every book', onclick:backupAll})])
    ])
  ]);
  modal('Publish “' + (t(book.title) || 'Untitled book') + '”', body);
}
function backup(){ if(!cur) return; saveFile(FBE.slug(cur.title) + '-backup.json', JSON.stringify(cur, null, 1), 'application/json'); }
function backupAll(){ saveFile('flipbook-studio-backup.json', JSON.stringify({books:books}, null, 1), 'application/json'); }

/* ---------- wiring ---------- */
$('home').addEventListener('click', function(){ if(cur){ store.put(cur); } renderLib(); });
$('btnNew').addEventListener('click', openNew);
$('btnImport').addEventListener('click', openImport);
$('btnRead').addEventListener('click', function(){ openReader(pagesFor(section)[0] || 0); });
$('btnPublish').addEventListener('click', openPublish);
$('bookTitle').addEventListener('input', function(){ if(!cur) return; cur.title = $('bookTitle').value; var e = $('f-cvTitle'); if(e) e.value = cur.title; changed(); });
window.addEventListener('beforeunload', function(){ if(cur) store.put(cur); });

store.open().then(function(ok){
  if(!ok){
    var n = $('storageNote'); n.hidden = false;
    n.textContent = 'This browser is not letting the studio save, so books last only until you close the page. Use Download backup file to keep your work.';
  }
  return store.all();
}).then(function(list){
  books = (list || []).map(normalize);
  if(!books.length){
    /* first visit: start with the guide template so the studio shows what it makes */
    var g = normalize(FBT.TEMPLATES.guide.make());
    books.push(g); store.put(g);
  }
  renderLib();
});
})();
</script>
